@keyframes fpGlowSoft {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(232,232,232,.7),

/* 大字进场：从虚到实（只用 opacity + translateY，丝滑） */

    transform: translateY(12px);
    letter-spacing: .35em;
  }
  to {
    opacity: 1;
    transform: translateY(0);

.fullpage-text.show p {

/* ============================================================

/* ============================================================
   背景层：防"缩放露黑边"
   bg-layer 缩放时，父层同色铺底，永远不漏黑
   ============================================================ */
html, body {
  background: #0a0a0a !important;
}
.bg-layer {
  background-color: #0a0a0a !important;
  transform-origin: center center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  will-change: transform, opacity;
}
/* 背景缩放时，overflow 裁掉，避免露出边界 */
.bg-layer,
.bg-layer img,
.sprite-layer,
.sprite-layer img {
  transform-origin: center center;
}
/* 只给真正的背景层铺底，立绘层保持透明 */
.game-page,
#bgLayer,
#bgNext {
  background-color: #0a0a0a !important;
}
#spriteLayer {
  background: transparent !important;
}

/* ============================================================
   全屏大字容器：彻底铺满，无黑边
   ============================================================ */
.fullpage-text {
  background: rgba(10,10,10,.96) !important;
  backdrop-filter: blur(4px) !important;
  -webkit-backdrop-filter: blur(4px) !important;
  padding: 0 !important;
  margin: 0 !important;
  overflow: hidden !important;
  inset: 0 !important;
}
.fullpage-text > p {
  padding: 40px 32px !important;
  margin: 0 !important;
  color: #e8e8e8 !important;
  font-family: "Songti SC", "SimSun", "Noto Serif SC", Georgia, serif !important;
  letter-spacing: .2em !important;
  line-height: 1.9 !important;
  font-weight: 500 !important;
}
@keyframes fpGlowSoft {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(232,232,232,.55),
      0 0 18px rgba(232,232,232,.25),
      2px 0 0 rgba(139,42,42,.45),
      -2px 0 0 rgba(232,232,232,.12);
  }
  50% {
    text-shadow:
      0 0 8px rgba(232,232,232,.9),
      0 0 32px rgba(232,232,232,.5),
      2px 0 0 rgba(139,42,42,.65),
      -2px 0 0 rgba(232,232,232,.3);
  }
}
.fullpage-text > p {
  animation: fpGlowSoft 4.5s ease-in-out infinite !important;
}
.fp-hint {
  color: #8b2a2a !important;
  text-shadow: 0 0 10px rgba(139,42,42,.65) !important;
  letter-spacing: .3em !important;
  animation: hintBreath 2s ease-in-out infinite !important;
}

}

/* 打字机渗墨样式统一由 static/css/skin.css .tw-char 管理（3.1） */


/* ============================================================
   缩放动画修复：不露背景边
   ============================================================ */

/* 1. 所有 fixed 背景层：父层铺底，防露边 */
body,
html,
.game-page {
  background: #0a0a0a !important;
}

/* 2. #bgLayer / #bgNext 铺满 + 裁掉溢出 */
#bgLayer, #bgNext {
  position: fixed !important;
  inset: 0 !important;
  overflow: hidden !important;
  background-color: #0a0a0a !important;
}
#bgLayer.show, #bgNext.show {
  background-size: cover !important;
  background-position: center !important;
}

/* 3. #bgNext 的 zoom：改成"不放大"（只用 opacity 交叉淡入） */
.bg-layer.zoom {
  transform: none !important;
  transition: opacity .8s cubic-bezier(.16,1,.3,1) !important;
}

/* 4. body.anim-zoom：不再缩 body，改成缩背景层 */
body.anim-zoom {
  animation: none !important;
}
body.anim-zoom #bgLayer,
body.anim-zoom .bg-layer {
  animation: anim-zoom-bg-k .9s cubic-bezier(.16,1,.3,1) !important;
  transform-origin: center center !important;
}
@keyframes anim-zoom-bg-k {
  0%   { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* 5. 立绘层不跟着缩 */
body.anim-zoom .sprite-layer {
  animation: none !important;
}


/* ============================================================
   立绘层：干掉 drop-shadow（黑块元凶）
   ============================================================ */

/* 1. 干掉 drop-shadow（性能差 + 黑块元凶） */
.sprite-layer img {
  filter: none !important;
  -webkit-filter: none !important;
}

/* 2. 立绘浮动：改成 GPU 加速的 transform */
.sprite-layer img.breathe {
  animation: breathe 4s cubic-bezier(.4,0,.2,1) infinite !important;
}
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

/* 3. 立绘容器：确保不溢出，不留黑影 */
.sprite-layer {
  overflow: visible !important;
  background: transparent !important;
  filter: none !important;
  -webkit-filter: none !important;
}

<script id="game-polish-js">
(function(){
  "use strict";

  /* -------- 1. 说话人移进 textBox -------- */
  function moveSpeaker(){
    var box = document.getElementById("textBox");
    var bar = document.getElementById("speakerBar");
    if (!box || !bar) return;
    if (bar.parentNode !== box) box.insertBefore(bar, box.firstChild);
    var nameEl = document.getElementById("speakerName");
    var hasName = nameEl && nameEl.textContent && nameEl.textContent.trim() !== "";
    if (hasName) { box.classList.add("has-speaker"); bar.classList.remove("hide"); }
    else         { box.classList.remove("has-speaker"); bar.classList.add("hide"); }
  }

  /* -------- 3. 跳节点 → 清 typing-done -------- */
  var lastText = "";
  function watchText(){
    var box = document.getElementById("textBox");
    var txt = document.getElementById("dialogText");
    if (!box || !txt) return;
    var cur = txt.textContent || "";
    if (cur !== lastText) {
      lastText = cur;
      box.classList.remove("typing-done");
    }
  }

  /* -------- 4. 打完 → typing-done -------- */
  function watchTypingDone(){
    var box = document.getElementById("textBox");
    var txt = document.getElementById("dialogText");
    if (!box || !txt) return;
    var chars = txt.querySelectorAll(".tw-char");
    if (chars.length === 0) return;
    var onCount = txt.querySelectorAll(".tw-char.tw-on").length;
    if (onCount === chars.length) box.classList.add("typing-done");
  }

  /* -------- rAF 循环（每帧跑，开销极小） -------- */
  function loop(){
    try { moveSpeaker(); } catch(e){}
    requestAnimationFrame(loop);
  }
  loop();

  /* -------- 低频：文字切换检测 -------- */
  setInterval(function(){
    try { watchText(); watchTypingDone(); } catch(e){}
  }, 200);

  /* 点击时立即刷光标 */
  document.addEventListener("click", function(){
    setTimeout(function(){ try { watchTypingDone(); } catch(e){} }, 60);
  }, true);
})();
</script>


<style>
/* 页面跳转淡出 */
body.leaving { opacity: 0; transition: opacity .35s ease; }
</style>
<script>
/* 拦截所有 a[href$=".html"] 点击，加淡出 */
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest('a[href$=".html"]');
  if (!a) return;
  var href = a.getAttribute("href");
  if (!href || href.startsWith("http") || href.startsWith("#")) return;
  e.preventDefault();
  document.body.classList.add("leaving");
  setTimeout(function(){ location.href = href; }, 360);
}, true);
</script>


<style>
/* 新页面加载后，从 0 淡入到 1 */
html {
  opacity: 0;
  transition: opacity .4s ease;
}
html.page-ready {
  opacity: 1;
}
</style>
<script>
/* 页面一加载完，立刻淡入 */
(function(){
  function fadeIn(){
    document.documentElement.classList.add("page-ready");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){
      requestAnimationFrame(fadeIn);
    });
  } else {
    requestAnimationFrame(fadeIn);
  }
})();
</script>


<script>
/* 主动注销所有 Service Worker + 清缓存（确保永远最新） */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  });
}
if ("caches" in window) {
  caches.keys().then(function(keys){
    keys.forEach(function(k){ caches.delete(k); });
  });
}
</script>

<script>
(function(){
  function bind(){
    var s=document.getElementById("qkSave"), l=document.getElementById("qkLoad");
    if(!s||!l||!window.__SAVE_UI) return;
    function intercept(btn, mode){
      if (btn.__lsBound) return; btn.__lsBound = true;
      btn.addEventListener("click", function(e){
        if (window.__SAVE_UI && window.__SAVE_UI.open){
          e.stopImmediatePropagation(); e.preventDefault();
          var p=document.getElementById("qkPanel"); if(p) p.classList.remove("on");
          window.__SAVE_UI.open(mode);
        }
      }, true);
    }
    intercept(s,"save"); intercept(l,"load");
  }
  setTimeout(bind, 800); setTimeout(bind, 2000);
})();
</script>

<script id="menu-fix">
(function(){
  "use strict";
  function ready(fn){ if(document.readyState!="loading") fn(); else document.addEventListener("DOMContentLoaded",fn); }

  ready(function(){

    /* ========== 顶栏菜单 ========== */
    var menu = document.getElementById("menuOverlay");
    var btnMenu = document.getElementById("btnMenu");
    var btnCloseMenu = document.getElementById("btnCloseMenu");
    var btnHome = document.getElementById("btnHome");
    var btnChapters = document.getElementById("btnChapters");
    var btnSave2 = document.getElementById("btnSave2");

    if (btnMenu && menu) btnMenu.addEventListener("click", function(){ menu.classList.add("show"); });
    if (btnCloseMenu && menu) btnCloseMenu.addEventListener("click", function(){ menu.classList.remove("show"); });
    if (btnHome) btnHome.addEventListener("click", function(){ location.href = "home.html"; });
    if (menu) menu.addEventListener("click", function(e){ if (e.target === menu) menu.classList.remove("show"); });

    /* ========== 章节弹窗 ========== */
    var chOv = document.getElementById("chaptersOverlay");
    var chList = document.getElementById("chapterList");
    var chClose = document.getElementById("btnCloseChapters");

    function loadChapters(){
      if (!chList || chList.dataset.loaded === "1") return;
      chList.dataset.loaded = "1";
      chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px;text-align:center">加载中…</p>';
      var url = (window.GAME_API && window.GAME_API.chapters) || "chapters.json";
      fetch(url).then(function(r){ return r.json(); }).then(function(d){
        var arr = d.chapters || d || [];
        chList.innerHTML = "";
        if (!arr.length){ chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px">暂无章节</p>'; return; }
        arr.forEach(function(c){
          var b = document.createElement("button");
          b.className = "chapter-item";
          b.innerHTML = '<span>' + (c.title || c.id) + '</span><span class="ch-status">' + (c.available ? "可游玩" : "敬请期待") + '</span>';
          if (c.available){
            b.addEventListener("click", function(){
              location.replace("game.html?chapter=" + (c.id || "ch1") + "&t=" + Date.now());
            });
          } else { b.classList.add("locked"); }
          chList.appendChild(b);
        });
      }).catch(function(){ chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px">加载失败</p>'; });
    }

    if (btnChapters) btnChapters.addEventListener("click", function(){
      if (menu) menu.classList.remove("show");
      if (chOv) chOv.classList.add("show");
      loadChapters();
    });
    if (chClose && chOv) chClose.addEventListener("click", function(){ chOv.classList.remove("show"); });
    if (chOv) chOv.addEventListener("click", function(e){ if (e.target === chOv) chOv.classList.remove("show"); });

    /* ========== 存档弹窗 ========== */
    var saveOv = document.getElementById("saveOverlay");
    var saveList = document.getElementById("saveList");
    var saveTitle = document.getElementById("saveTitle");
    var saveCount = document.getElementById("saveCount");
    var saveClose = document.getElementById("saveClose");
    var tabSave = document.getElementById("tabSave");
    var tabLoad = document.getElementById("tabLoad");
    var toolNew = document.getElementById("toolNew");
    var toolImport = document.getElementById("toolImport");
    var toolExport = document.getElementById("toolExport");
    var toolClear = document.getElementById("toolClear");

    var saveMode = "save";

    function closeSave(){ if (saveOv) saveOv.classList.remove("show"); }
    if (saveClose) saveClose.addEventListener("click", closeSave);
    if (saveOv) saveOv.addEventListener("click", function(e){ if (e.target === saveOv) closeSave(); });

    function switchMode(mode){
      saveMode = mode;
      if (tabSave) tabSave.classList.toggle("active", mode === "save");
      if (tabLoad) tabLoad.classList.toggle("active", mode === "load");
      refreshSaves();
    }

    if (tabSave) tabSave.addEventListener("click", function(){ switchMode("save"); });
    if (tabLoad) tabLoad.addEventListener("click", function(){ switchMode("load"); });

    function openSave(){
      if (menu) menu.classList.remove("show");
      if (saveOv) saveOv.classList.add("show");
      if (saveTitle) saveTitle.textContent = "存档系统";
      switchMode(saveMode);
    }

    if (btnSave2) btnSave2.addEventListener("click", function(){ openSave(); });

    /* 工具栏 */
    if (toolNew) toolNew.addEventListener("click", function(){
      var S = window.__SAVE_SYSTEM;
      if (!S){ alert("存档系统未加载"); return; }
      var all = S.loadAll();
      var free = -1;
      for (var i = 1; i <= S.MAX_SLOT; i++){ if (!all[i]){ free = i; break; } }
      if (free === -1){ alert("存档已满"); return; }
      var nm = prompt("新存档名：", "存档 " + free);
      if (nm === null) return;
      var result = S.save(free, nm || ("存档 " + free));
      refreshSaves();
    });

    if (toolImport) toolImport.addEventListener("click", function(){
      if (window.__IMPORT_SAVES) window.__IMPORT_SAVES();
    });
    if (toolExport) toolExport.addEventListener("click", function(){
      if (window.__EXPORT_SAVES) window.__EXPORT_SAVES();
    });
    if (toolClear) toolClear.addEventListener("click", function(){
      if (!confirm("清空所有存档？")) return;
      if (window.__CLEAR_ALL) window.__CLEAR_ALL();
      refreshSaves();
    });

    /* 列表 */
    function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    function refreshSaves(){
      if (!saveList) return;
      saveList.innerHTML = "";
      var S = window.__SAVE_SYSTEM;
      if (!S){
        saveList.innerHTML = '<p style="color:#8a8a8e;font-size:13px;text-align:center">存档系统未加载</p>';
        return;
      }

      var all = S.loadAll();
      var used = Object.keys(all).length;
      if (saveCount) saveCount.textContent = used + " / " + S.MAX_SLOT;

      /* 自动存档 */
      var auto = S.loadAuto();
      if (auto){
        var rowA = document.createElement("div");
        rowA.className = "save-item auto";
        rowA.innerHTML =
          '<div class="save-info">' +
            '<b>自动存档</b>' +
            '<span>' + esc(auto.chapter || "?") + ' · ' + esc(auto.node_id || "") + ' · ' + esc(auto.time || "") + '</span>' +
          '</div>' +
          '<div class="save-acts">' +
            (saveMode === "load" ? '<button class="save-btn main" data-act="loadauto">读取</button>' : '') +
          '</div>';
        if (saveMode === "load"){
          rowA.querySelector('[data-act="loadauto"]').addEventListener("click", function(e){
            e.stopPropagation();
            if (S.apply(auto)) closeSave();
          });
        }
        saveList.appendChild(rowA);
      }

      var keys = Object.keys(all).map(Number).sort(function(a,b){ return a - b; });
      if (!keys.length){
        var empty = document.createElement("p");
        empty.style.cssText = "color:#3a3a3c;font-size:13px;text-align:center;padding:20px";
        empty.textContent = "还没有存档";
        saveList.appendChild(empty);
      }

      keys.forEach(function(slot){
        var d = all[slot];
        var row = document.createElement("div");
        row.className = "save-item";

        var info = '<b>存档 ' + slot + ' · ' + esc(d.name || "") + '</b>' +
                   '<span>' + esc(d.chapter || "?") + ' · ' + esc(d.node_id || "") + ' · ' + esc(d.time || "") + '</span>';
        var acts = '<div class="save-acts">';
        if (saveMode === "save"){
          acts += '<button class="save-btn" data-act="overwrite">覆盖</button>';
        } else {
          acts += '<button class="save-btn main" data-act="load">读取</button>';
        }
        acts += '<button class="save-btn danger" data-act="del">删除</button></div>';
        row.innerHTML = '<div class="save-info">' + info + '</div>' + acts;

        var lb = row.querySelector('[data-act="load"]');
        var ob = row.querySelector('[data-act="overwrite"]');
        var db = row.querySelector('[data-act="del"]');

        if (lb) lb.addEventListener("click", function(e){
          e.stopPropagation();
          if (S.apply(d)) closeSave();
        });
        if (ob) ob.addEventListener("click", function(e){
          e.stopPropagation();
          var nm = prompt("存档名：", d.name || ("存档 " + slot));
          if (nm === null) return;
          var result = S.save(slot, nm || ("存档 " + slot));
          refreshSaves();
        });
        if (db) db.addEventListener("click", function(e){
          e.stopPropagation();
          if (!confirm("删除存档 " + slot + " ？")) return;
          S.del(slot);
          refreshSaves();
        });

        saveList.appendChild(row);
      });
    }
  });
})();
</script>
