body.ui-dark .ls-card h3{color:#e8e8ea;}

<style>
@keyframes spasm{
  0%{transform:translate(0)}
  25%{transform:translate(-8px,3px) skewX(-10deg)}
  50%{transform:translate(6px,-2px) skewX(8deg)}
  75%{transform:translate(-4px,1px)}
  100%{transform:none}
}

<script>
(function(){
  /* 一次性清掉所有旧版存档 key */
  try {
    Object.keys(localStorage).forEach(function(k){
      if (k.indexOf("ec_save") === 0 || k.indexOf("ec_auto") === 0 || k.indexOf("ec_current") === 0 || k.indexOf("ec_node") === 0){
        localStorage.removeItem(k);
      }
    });
  } catch(e){}
})();
</script>

<style id="no-invert-protect">
html, body { color-scheme: dark only !important; forced-color-adjust: none !important; filter: none !important; }
img, svg, canvas, video { filter: none !important; mix-blend-mode: normal !important; forced-color-adjust: none !important; }
@media (forced-colors: active) { img, svg, canvas { forced-color-adjust: none !important; } }

<script>
(function(){
  function clean(){
    try {
      document.body.style.filter = "none";
      document.documentElement.style.filter = "none";
      document.querySelectorAll("img, svg, canvas").forEach(function(el){
        el.style.filter = "none";
      });
    } catch(e){}
  }
  document.addEventListener("DOMContentLoaded", clean);
  setTimeout(clean, 500);
  setInterval(clean, 3000);
})();
</script>

<script>
(function(){
  function bind(){
    var s=document.getElementById("qkSave"), l=document.getElementById("qkLoad");
    if(!s||!l||!window.__SAVE_UI) return;
    function intercept(btn, mode){
      if (btn.__lsBound) return; btn.__lsBound = true;
      btn.addEventListener("click", function(e){
        if (window.__SAVE_UI && window.__SAVE_UI.open){
          e.stopImmediatePropagation(); e.preventDefault();
          var p=document.getElementById("qkPanel"); if(p) p.classList.remove("on");
          window.__SAVE_UI.open(mode);
        }
      }, true);
    }
    intercept(s,"save"); intercept(l,"load");
  }
  setTimeout(bind, 800); setTimeout(bind, 2000);
})();
</script>

<script id="menu-fix">
(function(){
  "use strict";
  function ready(fn){ if(document.readyState!="loading") fn(); else document.addEventListener("DOMContentLoaded",fn); }

  ready(function(){

    /* ========== 顶栏菜单 ========== */
    var menu = document.getElementById("menuOverlay");
    var btnMenu = document.getElementById("btnMenu");
    var btnCloseMenu = document.getElementById("btnCloseMenu");
    var btnHome = document.getElementById("btnHome");
    var btnChapters = document.getElementById("btnChapters");
    var btnSave2 = document.getElementById("btnSave2");

    if (btnMenu && menu) btnMenu.addEventListener("click", function(){ menu.classList.add("show"); });
    if (btnCloseMenu && menu) btnCloseMenu.addEventListener("click", function(){ menu.classList.remove("show"); });
    if (btnHome) btnHome.addEventListener("click", function(){ location.href = "home.html"; });
    if (menu) menu.addEventListener("click", function(e){ if (e.target === menu) menu.classList.remove("show"); });

    /* ========== 章节弹窗 ========== */
    var chOv = document.getElementById("chaptersOverlay");
    var chList = document.getElementById("chapterList");
    var chClose = document.getElementById("btnCloseChapters");

    function loadChapters(){
      if (!chList || chList.dataset.loaded === "1") return;
      chList.dataset.loaded = "1";
      chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px;text-align:center">加载中…</p>';
      var url = (window.GAME_API && window.GAME_API.chapters) || "chapters.json";
      fetch(url).then(function(r){ return r.json(); }).then(function(d){
        var arr = d.chapters || d || [];
        chList.innerHTML = "";
        if (!arr.length){ chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px">暂无章节</p>'; return; }
        arr.forEach(function(c){
          var b = document.createElement("button");
          b.className = "chapter-item";
          b.innerHTML = '<span>' + (c.title || c.id) + '</span><span class="ch-status">' + (c.available ? "可游玩" : "敬请期待") + '</span>';
          if (c.available){
            b.addEventListener("click", function(){
              location.replace("game.html?chapter=" + (c.id || "ch1") + "&t=" + Date.now());
            });
          } else { b.classList.add("locked"); }
          chList.appendChild(b);
        });
      }).catch(function(){ chList.innerHTML = '<p style="color:#8a8a8e;font-size:13px">加载失败</p>'; });
    }

    if (btnChapters) btnChapters.addEventListener("click", function(){
      if (menu) menu.classList.remove("show");
      if (chOv) chOv.classList.add("show");
      loadChapters();
    });
    if (chClose && chOv) chClose.addEventListener("click", function(){ chOv.classList.remove("show"); });
    if (chOv) chOv.addEventListener("click", function(e){ if (e.target === chOv) chOv.classList.remove("show"); });

    /* ========== 存档弹窗 ========== */
    var saveOv = document.getElementById("saveOverlay");
    var saveList = document.getElementById("saveList");
    var saveTitle = document.getElementById("saveTitle");
    var saveCount = document.getElementById("saveCount");
    var saveClose = document.getElementById("saveClose");
    var tabSave = document.getElementById("tabSave");
    var tabLoad = document.getElementById("tabLoad");
    var toolNew = document.getElementById("toolNew");
    var toolImport = document.getElementById("toolImport");
    var toolExport = document.getElementById("toolExport");
    var toolClear = document.getElementById("toolClear");

    var saveMode = "save";

    function closeSave(){ if (saveOv) saveOv.classList.remove("show"); }
    if (saveClose) saveClose.addEventListener("click", closeSave);
    if (saveOv) saveOv.addEventListener("click", function(e){ if (e.target === saveOv) closeSave(); });

    function switchMode(mode){
      saveMode = mode;
      if (tabSave) tabSave.classList.toggle("active", mode === "save");
      if (tabLoad) tabLoad.classList.toggle("active", mode === "load");
      refreshSaves();
    }

    if (tabSave) tabSave.addEventListener("click", function(){ switchMode("save"); });
    if (tabLoad) tabLoad.addEventListener("click", function(){ switchMode("load"); });

    function openSave(){
      if (menu) menu.classList.remove("show");
      if (saveOv) saveOv.classList.add("show");
      if (saveTitle) saveTitle.textContent = "存档系统";
      switchMode(saveMode);
    }

    if (btnSave2) btnSave2.addEventListener("click", function(){ openSave(); });

    /* 工具栏 */
    if (toolNew) toolNew.addEventListener("click", function(){
      var S = window.__SAVE_SYSTEM;
      if (!S){ alert("存档系统未加载"); return; }
      var all = S.loadAll();
      var free = -1;
      for (var i = 1; i <= S.MAX_SLOT; i++){ if (!all[i]){ free = i; break; } }
      if (free === -1){ alert("存档已满"); return; }
      var nm = prompt("新存档名：", "存档 " + free);
      if (nm === null) return;
      var result = S.save(free, nm || ("存档 " + free));
      refreshSaves();
    });

    if (toolImport) toolImport.addEventListener("click", function(){
      if (window.__IMPORT_SAVES) window.__IMPORT_SAVES();
    });
    if (toolExport) toolExport.addEventListener("click", function(){
      if (window.__EXPORT_SAVES) window.__EXPORT_SAVES();
    });
    if (toolClear) toolClear.addEventListener("click", function(){
      if (!confirm("清空所有存档？")) return;
      if (window.__CLEAR_ALL) window.__CLEAR_AL
      refreshSaves();
    });

    /* 列表 */
    function refreshSaves(){
      if (!saveList) return;
      saveList.innerHTML = "";
      var S = window.__SAVE_SYSTEM;
      if (!S){
        saveList.innerHTML = '<p style="color:#8a8a8e;font-size:13px;text-align:center">存档系统未加载</p>';
        return;
      }

      var all = S.loadAll();
      var used = Object.keys(all).length;
      if (saveCount) saveCount.textContent = used + " / " + S.MAX_SLOT;

      /* 自动存档 */
      var auto = S.loadAuto();
      if (auto){
        var rowA = document.createElement("div");
        rowA.className = "save-item auto";
        rowA.innerHTML =
          '<div class="save-info">' +
            '<b>自动存档</b>' +
            '<span>' + (auto.chapter || "?") + ' · ' + (auto.node_id || "") + ' · ' + (auto.time || "") + '</span>' +
          '</div>' +
          '<div class="save-acts">' +
            (saveMode === "load" ? '<button class="save-btn main" data-act="loadauto">读取</button>' : '') +
          '</div>';
        if (saveMode === "load"){
          rowA.querySelector('[data-act="loadauto"]').addEventListener("click", function(e){
            e.stopPropagation();
            if (S.apply(auto)) closeSave();
          });
        }
        saveList.appendChild(rowA);
      }

      var keys = Object.keys(all).map(Number).sort(function(a,b){ return a - b; });
      if (!keys.length){
        var empty = document.createElement("p");
        empty.style.cssText = "color:#3a3a3c;font-size:13px;text-align:center;padding:20px";
        empty.textContent = "还没有存档";
        saveList.appendChild(empty);
      }

      keys.forEach(function(slot){
        var d = all[slot];
        var row = document.createElement("div");
        row.className = "save-item";

        var info = '<b>存档 ' + slot + ' · ' + (d.name || "") + '</b>' +
                   '<span>' + (d.chapter || "?") + ' · ' + (d.node_id || "") + ' · ' + (d.time || "") + '</span>';
        var acts = '<div class="save-acts">';
        if (saveMode === "save"){
          acts += '<button class="save-btn" data-act="overwrite">覆盖</button>';
        } else {
          acts += '<button class="save-btn main" data-act="load">读取</button>';
        }
        acts += '<button class="save-btn danger" data-act="del">删除</button></div>';
        row.innerHTML = '<div class="save-info">' + info + '</div>' + acts;

        var lb = row.querySelector('[data-act="load"]');
        var ob = row.querySelector('[data-act="overwrite"]');
        var db = row.querySelector('[data-act="del"]');

        if (lb) lb.addEventListener("click", function(e){
          e.stopPropagation();
          if (S.apply(d)) closeSave();
        });
        if (ob) ob.addEventListener("click", function(e){
          e.stopPropagation();
          var nm = prompt("存档名：", d.name || ("存档 " + slot));
          if (nm === null) return;
          var result = S.save(slot, nm || ("存档 " + slot));
          refreshSaves();
        });
        if (db) db.addEventListener("click", function(e){
          e.stopPropagation();
          if (!confirm("删除存档 " + slot + " ？")) return;
          S.del(slot);
          refreshSaves();
        });

        saveList.appendChild(row);
      });
    }
  });
})();
</script>

<script id="cheat-hack">
(function(){
  "use strict";
  var FAB = document.getElementById("cheatFab");
  var PANEL = document.getElementById("cheatPanel");
  if (!FAB || !PANEL) return;

  var KEY = "ec_cheat_enabled";
  var GOD_KEY = "ec_god_mode";
  var SAN_LOCK = "ec_san_lock";
  var NOFX_KEY = "ec_no_fx";
  var NOANIM_KEY = "ec_no_anim";
  var NODEATH = "ec_no_death";

  function isOn(){ try { return localStorage.getItem(KEY) === "1"; } catch(e){ return false; } }

  function sync(){
    if (isOn()) FAB.classList.add("show");
    else { FAB.classList.remove("show"); PANEL.classList.remove("show"); }
  }
  sync();
  setInterval(sync, 1000);

  /* ===== ⚙ 拖拽 + 点击（最终版）===== */
  (function(){
    var dragging=false, moved=false, ox=0, oy=0, sx=0, sy=0, downOnFab=false;

    function pt(e){
      if (e.touches && e.touches[0]) return {x:e.touches[0].clientX, y:e.touches[0].clientY};
      if (e.changedTouches && e.changedTouches[0]) return {x:e.changedTouches[0].clientX, y:e.changedTouches[0].clientY};
      return {x:e.clientX, y:e.clientY};
    }

    // 只在按钮按下时启动拖拽
    FAB.addEventListener("mousedown", function(e){
      dragging=true; moved=false; downOnFab=true;
      var p=pt(e), r=FAB.getBoundingClientRect();
      sx=p.x; sy=p.y; ox=p.x-r.left; oy=p.y-r.top;
      FAB.style.transition="none";
    });
    FAB.addEventListener("touchstart", function(e){
      dragging=true; moved=false; downOnFab=true;
      var p=pt(e), r=FAB.getBoundingClientRect();
      sx=p.x; sy=p.y; ox=p.x-r.left; oy=p.y-r.top;
      FAB.style.transition="none";
    }, { passive: true });

    document.addEventListener("mousemove", function(e){
      if(!dragging) return;
      var p=pt(e);
      if (Math.abs(p.x-sx)>5 || Math.abs(p.y-sy)>5) moved=true;
      if(!moved) return;
      var nx=p.x-ox, ny=p.y-oy;
      nx=Math.max(0,Math.min(window.innerWidth-FAB.offsetWidth,nx));
      ny=Math.max(0,Math.min(window.innerHeight-FAB.offsetHeight,ny));
      FAB.style.left=nx+"px"; FAB.style.top=ny+"px";
      FAB.style.right="auto"; FAB.style.bottom="auto";
      if (e.cancelable) e.preventDefault();
    });
    document.addEventListener("touchmove", function(e){
      if(!dragging) return;
      var p=pt(e);
      if (Math.abs(p.x-sx)>5 || Math.abs(p.y-sy)>5) moved=true;
      if(!moved) return;
      var nx=p.x-ox, ny=p.y-oy;
      nx=Math.max(0,Math.min(window.innerWidth-FAB.offsetWidth,nx));
      ny=Math.max(0,Math.min(window.innerHeight-FAB.offsetHeight,ny));
      FAB.style.left=nx+"px"; FAB.style.top=ny+"px";
      FAB.style.right="auto"; FAB.style.bottom="auto";
      if (e.cancelable) e.preventDefault();
    }, { passive: false });

    function endDrag(){
      if(!dragging) return;
      dragging=false;
      FAB.style.transition="";
      if (moved || !downOnFab) { downOnFab=false; return; }
      downOnFab=false;
      // 没拖 → 点击开关
      PANEL.classList.toggle("show");
      try { refreshStats(); } catch(err){}
    }
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchend", endDrag);
    document.addEventListener("touchcancel", endDrag);
  })();


        /* ===== 最简点击逻辑 ===== */
        (function(){
    var closeBtn = document.getElementById("cfClose");
    if (!closeBtn) return;
    var lastTap = 0;
    function closePanel(e){
      var now = Date.now();
      if (now - lastTap < 300) return;
      lastTap = now;
      PANEL.classList.remove("show");
      if (e && e.preventDefault) e.preventDefault();
    }
    closeBtn.addEventListener("click", closePanel);
    closeBtn.addEventListener("touchend", closePanel, { passive: false });
  })();

  /* 拖拽 */
  (function(){
    var head = document.getElementById("cfHead");
    var dragging = false, ox = 0, oy = 0;
    function pt(e){
      if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    head.addEventListener("mousedown", down);
    head.addEventListener("touchstart", down, { passive: false });
    function down(e){
      dragging = true;
      var p = pt(e);
      var r = PANEL.getBoundingClientRect();
      ox = p.x - r.left; oy = p.y - r.top;
      e.preventDefault && e.preventDefault();
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("touchmove", move, { passive: false });
    function move(e){
      if (!dragging) return;
      var p = pt(e);
      var nx = p.x - ox, ny = p.y - oy;
      nx = Math.max(0, Math.min(window.innerWidth - PANEL.offsetWidth, nx));
      ny = Math.max(0, Math.min(window.innerHeight - PANEL.offsetHeight, ny));
      PANEL.style.left = nx + "px"; PANEL.style.top = ny + "px";
      PANEL.style.right = "auto";
      e.preventDefault && e.preventDefault();
    }
    document.addEventListener("mouseup", function(){ dragging = false; });
    document.addEventListener("touchend", function(){ dragging = false; });
  })();

  /* Tab */
  document.querySelectorAll(".cf-tab").forEach(function(t){
    t.addEventListener("click", function(){
      document.querySelectorAll(".cf-tab").forEach(function(x){ x.classList.remove("active"); });
      document.querySelectorAll(".cf-pane").forEach(function(x){ x.classList.remove("active"); });
      t.classList.add("active");
      var p = document.querySelector('.cf-pane[data-pane="' + t.dataset.tab + '"]');
      if (p) p.classList.add("active");
    });
  });

  /* 状态刷新 */
  function refreshStats(){
    var node = window.__curNodeId ? window.__curNodeId() : "-";
    var vars = window.__curVars ? window.__curVars() : {};
    document.getElementById("cfNode").textContent = node || "-";
    document.getElementById("cfSan").textContent = vars.san != null ? vars.san : "-";
    document.getElementById("cfClue").textContent = vars.clue != null ? vars.clue : "-";
  }
  setInterval(refreshStats, 1500);

  /* 作弊逻辑 */
  function setSan(v){
    if (window.__setVars) window.__setVars({ san: v });
    var num = document.getElementById("sanNum");
    var fill = document.getElementById("sanFill");
    if (num) num.textContent = v;
    if (fill) fill.style.width = (v < 0 ? 0 : Math.min(100, v)) + "%";
  }

  function skipLine(){
    var box = document.getElementById("textBox");
    if (box){ box.click(); box.click(); }
  }
  function skipNode(){
    var i = 0;
    var t = setInterval(function(){ skipLine(); i++; if (i >= 20) clearInterval(t); }, 50);
  }
  function skipChapter(){
    var i = 0;
    var t = setInterval(function(){
      skipLine(); i++;
      if (i >= 500){ clearInterval(t); alert("已连点 500 次，停止"); }
    }, 40);
  }
  function skipMini(){
    var A = window.__MINI_ANSWER;
    if (!A){ document.querySelectorAll(".mg-overlay button").forEach(function(b){ b.click(); }); return; }
    if (A.type === "spell"){
      var target = A.letters.slice(), done = 0, guard = 0;
      var t = setInterval(function(){
        guard++; if (guard > 60){ clearInterval(t); return; }
        var avail = document.querySelectorAll(".mg-pool .mg-letter:not(.used)");
        if (!avail.length || done >= target.length){ clearInterval(t); return; }
        var want = target[done], found = null;
        avail.forEach(function(b){ if (!found && b.textContent.trim().toLowerCase() === want) found = b; });
        if (found){ found.click(); done++; } else { avail[0].click(); done++; }
      }, 70);
      return;
    }
    if (A.type === "dictation"){
      var opts = document.querySelectorAll(".mg-opt");
      var picked = false;
      opts.forEach(function(b){ if (!picked && b.textContent.trim() === A.answer){ b.click(); picked = true; } });
      if (!picked && opts.length) opts[0].click();
      return;
    }
    if (document.querySelector(".mg-write-btn")){
      var t2 = setInterval(function(){
        var b = document.querySelector(".mg-write-btn");
        if (!b){ clearInterval(t2); return; }
        b.click();
      }, 40);
      return;
    }
    var dodge = document.querySelector(".mg-dodge");
    if (dodge){ dodge.click(); return; }
    document.querySelectorAll(".mg-overlay button").forEach(function(b){ b.click(); });
  }

  function titleGlitch(){
    var t = document.querySelector(".topbar-title");
    if (!t) return;
    t.style.animation = "none";
    void t.offsetWidth;
    t.style.animation = "spasm 0.15s steps(2) 20";
    t.style.color = "#1d1d1f";
    setTimeout(function(){ t.style.animation = ""; t.style.color = ""; }, 3500);
  }
  function bloodRain(){
    for (var i = 0; i < 30; i++){
      (function(idx){
        setTimeout(function(){
          var d = document.createElement("div");
          d.textContent = "🩸";
          d.style.cssText = "position:fixed;left:" + (Math.random()*100) + "vw;top:-40px;font-size:" + (14+Math.random()*20) + "px;z-index:9999;pointer-events:none;transition:top 2.5s linear,opacity 2.5s;";
          document.body.appendChild(d);
          requestAnimationFrame(function(){ d.style.top = "110vh"; d.style.opacity = "0"; });
          setTimeout(function(){ d.remove(); }, 3000);
        }, idx * 80);
      })(i);
    }
  }
  function flashAll(){
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;inset:0;background:#1d1d1f;opacity:0;z-index:9999;pointer-events:none;transition:opacity .3s;";
    document.body.appendChild(d);
    var i = 0;
    var t = setInterval(function(){
      i++;
      d.style.opacity = (i % 2 === 0) ? "0.6" : "0";
      if (i >= 6){ clearInterval(t); d.remove(); }
    }, 200);
  }
  function renameHero(){
    var n = prompt("改主角名字：", "我");
    if (n === null) return;
    try { localStorage.setItem("ec_hero_name", n || "我"); } catch(e){}
    var sp = document.getElementById("speakerName");
    if (sp && sp.textContent === "我") sp.textContent = n || "我";
  }
  function ghostText(){
    for (var i = 0; i < 20; i++){
      (function(idx){
        setTimeout(function(){
          var d = document.createElement("div");
          d.textContent = ["程丽","明天见","别回头","你逃不掉","她来了"][Math.floor(Math.random()*5)];
          d.style.cssText = "position:fixed;left:" + (Math.random()*90) + "vw;top:" + (Math.random()*90) + "vh;color:#1d1d1f;font-size:" + (16+Math.random()*30) + "px;font-weight:900;z-index:9999;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;letter-spacing:.1em;";
          document.body.appendChild(d);
          requestAnimationFrame(function(){ d.style.opacity = "1"; d.style.transform = "translateY(-10px)"; });
          setTimeout(function(){ d.style.opacity = "0"; }, 1500);
          setTimeout(function(){ d.remove(); }, 2000);
        }, idx * 100);
      })(i);
    }
  }

  /* 开关 */
  function bindSw(id, key, cb){
    var el = document.getElementById(id);
    if (!el) return;
    try { el.checked = localStorage.getItem(key) === "1"; } catch(e){}
    el.addEventListener("change", function(){
      try { if (el.checked) localStorage.setItem(key, "1"); else localStorage.removeItem(key); } catch(e){}
      if (cb) cb(el.checked);
    });
  }
  bindSw("cfGod", GOD_KEY, function(v){
    if (v) try { localStorage.removeItem(SAN_LOCK); } catch(e){}
  });
  bindSw("cfNoDeath", NODEATH);
  bindSw("cfNoFx", NOFX_KEY, function(v){
    document.body.classList.toggle("no-horror", v);
  });
  bindSw("cfNoAnim", NOANIM_KEY, function(v){
    document.body.classList.toggle("no-anim", v);
  });

  /* 面板点击 */
  PANEL.addEventListener("click", function(e){
    var t = e.target;
    if (!t) return;

    /* 按钮 [data-act] */
    if (t.tagName === "BUTTON" && t.dataset.act){
      var act = t.dataset.act;
      if (act === "san0"){ try { localStorage.setItem(SAN_LOCK, "0"); localStorage.removeItem(GOD_KEY); } catch(e){} setSan(0); }
      else if (act === "sanmin"){ try { localStorage.setItem(SAN_LOCK, "-999"); localStorage.removeItem(GOD_KEY); } catch(e){} setSan(-999); }
      else if (act === "sanmax"){ try { localStorage.setItem(SAN_LOCK, "99"); localStorage.removeItem(GOD_KEY); } catch(e){} setSan(99); }
      else if (act === "sanfree"){ try { localStorage.removeItem(SAN_LOCK); localStorage.removeItem(GOD_KEY); } catch(e){} setSan(0); }
      else if (act === "skipLine") skipLine();
      else if (act === "skipNode") skipNode();
      else if (act === "skipMini") skipMini();
      else if (act === "skipChapter") skipChapter();
      else if (act === "ch1") location.replace("game.html?chapter=ch1&t=" + Date.now());
      else if (act === "ch2") location.replace("game.html?chapter=ch2&t=" + Date.now());
      else if (act === "ch3") location.replace("game.html?chapter=ch3&t=" + Date.now());
      else if (act === "secret"){
        localStorage.setItem("ec_endings_v1", JSON.stringify(["c3_stay","c3_escape","c3_samename","c3_holiday","c3_return","c3_chengli"]));
        location.replace("game.html?chapter=ch3&t=" + Date.now());
      }
      else if (act === "perspectiveChengli"){
        window.__PERSPECTIVE = "chengli";
        document.body.classList.add("perspective-chengli");
        alert("已切换到程丽视角");
      }
      else if (act === "perspectiveHero"){
        window.__PERSPECTIVE = "hero";
        document.body.classList.remove("perspective-chengli");
        alert("已切换回主角视角");
      }
      else if (act === "titleGlitch") titleGlitch();
      else if (act === "rain") bloodRain();
      else if (act === "flashAll") flashAll();
      else if (act === "renameHero") renameHero();
      else if (act === "ghostText") ghostText();
      else if (act === "resetAll"){
        if (!confirm("恢复默认？将清空所有作弊设置")) return;
        [KEY, GOD_KEY, SAN_LOCK, NOFX_KEY, NOANIM_KEY, NODEATH].forEach(function(k){
          try { localStorage.removeItem(k); } catch(e){}
        });
        document.body.classList.remove("no-horror","no-anim","perspective-chengli");
        setSan(0);
        alert("已恢复默认");
      }
      else if (act === "cheatOff"){
        try { localStorage.removeItem(KEY); } catch(e){}
        sync();
      }
      return;
    }
  });

  /* 后台轮询 */
  setInterval(function(){
    try {
      if (!isOn()) return;
      if (localStorage.getItem(GOD_KEY) === "1"){
        setSan(-999);
      } else {
        var lock = localStorage.getItem(SAN_LOCK);
        if (lock !== null) setSan(parseInt(lock, 10) || 0);
      }
    } catch(e){}
  }, 300);

  /* 启动时恢复视觉设置 */
  try {
    if (localStorage.getItem(NOFX_KEY) === "1") document.body.classList.add("no-horror");
    if (localStorage.getItem(NOANIM_KEY) === "1") document.body.classList.add("no-anim");
  } catch(e){}

  refreshStats();
})();
</script>
