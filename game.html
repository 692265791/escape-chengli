<style>

/* ========== 全屏大字 · 丝滑浮现 ========== */
.fullpage-text p {
  animation: fpGlowSoft 4s ease-in-out infinite !important;
}
@keyframes fpGlowSoft {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(232,232,232,.7),
      0 0 20px rgba(232,232,232,.3),
      2px 0 0 rgba(139,42,42,.5),
      -2px 0 0 rgba(232,232,232,.2);
  }
  50% {
    text-shadow:
      0 0 8px rgba(232,232,232,.95),
      0 0 32px rgba(232,232,232,.5),
      2px 0 0 rgba(139,42,42,.7),
      -2px 0 0 rgba(232,232,232,.35);
  }
}
/* 大字进场：从虚到实（只用 opacity + translateY，丝滑） */
@keyframes fpTextIn {
  from {
    opacity: 0;
    transform: translateY(12px);
    letter-spacing: .35em;
  }
  to {
    opacity: 1;
    transform: translateY(0);
    letter-spacing: .2em;
  }
}
.fullpage-text.show p {
  animation: fpTextIn 1.4s cubic-bezier(.16,1,.3,1) forwards, fpGlowSoft 4s ease-in-out 1.4s infinite !important;
}




/* ============================================================
   对话框：静止（不摇）
   ============================================================ */
.text-box {
  animation: none !important;
  transform: none !important;
}

/* ============================================================
   背景层：防"缩放露黑边"
   bg-layer 缩放时，父层同色铺底，永远不漏黑
   ============================================================ */
html, body {
  background: #0a0a0a !important;
}
.bg-layer {
  background-color: #0a0a0a !important;
  transform-origin: center center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  will-change: transform, opacity;
}
/* 背景缩放时，overflow 裁掉，避免露出边界 */
.bg-layer,
.bg-layer img,
.sprite-layer,
.sprite-layer img {
  transform-origin: center center;
}
/* 只给真正的背景层铺底，立绘层保持透明 */
.game-page,
#bgLayer,
#bgNext {
  background-color: #0a0a0a !important;
}
#spriteLayer {
  background: transparent !important;
}

/* ============================================================
   全屏大字容器：彻底铺满，无黑边
   ============================================================ */
.fullpage-text {
  background: rgba(10,10,10,.96) !important;
  backdrop-filter: blur(4px) !important;
  -webkit-backdrop-filter: blur(4px) !important;

}

  font-weight: 500 !important;
}
@keyframes fpGlowSoft {
  0%, 100% {
    text-shadow:
      0 0 4px rgba(232,232,232,.55),
      0 0 18px rgba(232,232,232,.25),
      2px 0 0 rgba(139,42,42,.45),
      -2px 0 0 rgba(232,232,232,.12);
  }
  50% {
    text-shadow:
      0 0 8px rgba(232,232,232,.9),
      0 0 32px rgba(232,232,232,.5),
      2px 0 0 rgba(139,42,42,.65),
      -2px 0 0 rgba(232,232,232,.3);
  }
}
.fullpage-text > p {
  animation: fpGlowSoft 4.5s ease-in-out infinite !important;
}
.fp-hint {
  color: #8b2a2a !important;
  text-shadow: 0 0 10px rgba(139,42,42,.65) !important;
  letter-spacing: .3em !important;
  animation: hintBreath 2s ease-in-out infinite !important;
}
@keyframes hintBreath {
  0%, 100% { opacity: .5; transform: translateX(-50%) translateY(0); }
  50%      { opacity: 1;  transform: translateX(-50%) translateY(3px); }
}

/* ============================================================
   打字机：横向模糊（慢 + 长 + 丝滑）
   起点 8px 偏移 + 强光晕 → 终点归位 + 光晕收敛
   ============================================================ */
.tw-char {
  display: inline !important;
  opacity: 0 !important;
  transform: translateX(-8px) !important;
  text-shadow:
    0 0 14px rgba(232,232,232,1),
    0 0 28px rgba(232,232,232,.6),
    0 0 40px rgba(139,42,42,.3) !important;
  transition:
    opacity .8s cubic-bezier(.16,1,.3,1),
    transform .8s cubic-bezier(.16,1,.3,1),
    text-shadow 1.1s cubic-bezier(.16,1,.3,1) !important;
  will-change: opacity, transform;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.tw-char.tw-on {
  opacity: 1 !important;
  transform: translateX(0) !important;
  text-shadow: 0 0 3px rgba(232,232,232,.35) !important;
}
.text-box.typing-done .tw-char { will-change: auto !important; }


/* ============================================================
   缩放动画修复：不露背景边
   ============================================================ */

/* 1. 所有 fixed 背景层：父层铺底，防露边 */
body,
html,
.game-page {
  background: #0a0a0a !important;
}

/* 2. #bgLayer / #bgNext 铺满 + 裁掉溢出 */
#bgLayer, #bgNext {
  position: fixed !important;
  inset: 0 !important;
  overflow: hidden !important;
  background-color: #0a0a0a !important;
}
#bgLayer.show, #bgNext.show {
  background-size: cover !important;
  background-position: center !important;
}

/* 3. #bgNext 的 zoom：改成"不放大"（只用 opacity 交叉淡入） */
.bg-layer.zoom {
  transform: none !important;
  transition: opacity .8s cubic-bezier(.16,1,.3,1) !important;
}

/* 4. body.anim-zoom：不再缩 body，改成缩背景层 */
body.anim-zoom {
  animation: none !important;
}
body.anim-zoom #bgLayer,
body.anim-zoom .bg-layer {
  animation: anim-zoom-bg-k .9s cubic-bezier(.16,1,.3,1) !important;
  transform-origin: center center !important;
}
@keyframes anim-zoom-bg-k {
  0%   { transform: scale(1.06); }
  100% { transform: scale(1); }
}

/* 5. 立绘层不跟着缩 */
body.anim-zoom .sprite-layer {
  animation: none !important;
}


/* ============================================================
   立绘层：干掉 drop-shadow（黑块元凶）
   ============================================================ */

/* 1. 干掉 drop-shadow（性能差 + 黑块元凶） */
.sprite-layer img {
  filter: none !important;
  -webkit-filter: none !important;
}

/* 2. 立绘浮动：改成 GPU 加速的 transform */
.sprite-layer img.breathe {
  animation: breathe 4s cubic-bezier(.4,0,.2,1) infinite !important;
}
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}

/* 3. 立绘容器：确保不溢出，不留黑影 */
.sprite-layer {
  overflow: visible !important;
  background: transparent !important;
  filter: none !important;
  -webkit-filter: none !important;
}

<script id="game-polish-js">
(function(){
  "use strict";

  /* -------- 1. 说话人移进 textBox -------- */
  function moveSpeaker(){
    var box = document.getElementById("textBox");
    var bar = document.getElementById("speakerBar");
    if (!box || !bar) return;
    if (bar.parentNode !== box) box.insertBefore(bar, box.firstChild);
    var nameEl = document.getElementById("speakerName");
    var hasName = nameEl && nameEl.textContent && nameEl.textContent.trim() !== "";
    if (hasName) { box.classList.add("has-speaker"); bar.classList.remove("hide"); }
    else         { box.classList.remove("has-speaker"); bar.classList.add("hide"); }
  }

  /* -------- 3. 跳节点 → 清 typing-done -------- */
  var lastText = "";
  function watchText(){
    var box = document.getElementById("textBox");
    var txt = document.getElementById("dialogText");
    if (!box || !txt) return;
    var cur = txt.textContent || "";
    if (cur !== lastText) {
      lastText = cur;
      box.classList.remove("typing-done");
    }
  }

  /* -------- 4. 打完 → typing-done -------- */
  function watchTypingDone(){
    var box = document.getElementById("textBox");
    var txt = document.getElementById("dialogText");
    if (!box || !txt) return;
    var chars = txt.querySelectorAll(".tw-char");
    if (chars.length === 0) return;
    var onCount = txt.querySelectorAll(".tw-char.tw-on").length;
    if (onCount === chars.length) box.classList.add("typing-done");
  }

  /* -------- rAF 循环（每帧跑，开销极小） -------- */
  function loop(){
    try { moveSpeaker(); } catch(e){}
    requestAnimationFrame(loop);
  }
  loop();

  /* -------- 低频：文字切换检测 -------- */
  setInterval(function(){
    try { watchText(); watchTypingDone(); } catch(e){}
  }, 200);

  /* 点击时立即刷光标 */
  document.addEventListener("click", function(){
    setTimeout(function(){ try { watchTypingDone(); } catch(e){} }, 60);
  }, true);
})();
</script>


<style>
/* 页面跳转淡出 */
body.leaving { opacity: 0; transition: opacity .35s ease; }
</style>
<script>
/* 拦截所有 a[href$=".html"] 点击，加淡出 */
document.addEventListener("click", function(e){
  var a = e.target.closest && e.target.closest('a[href$=".html"]');
  if (!a) return;
  var href = a.getAttribute("href");
  if (!href || href.startsWith("http") || href.startsWith("#")) return;
  e.preventDefault();
  document.body.classList.add("leaving");
  setTimeout(function(){ location.href = href; }, 360);
}, true);
</script>


<style>
/* 新页面加载后，从 0 淡入到 1 */
html {
  opacity: 0;
  transition: opacity .4s ease;
}
html.page-ready {
  opacity: 1;
}
</style>
<script>
/* 页面一加载完，立刻淡入 */
(function(){
  function fadeIn(){
    document.documentElement.classList.add("page-ready");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){
      requestAnimationFrame(fadeIn);
    });
  } else {
    requestAnimationFrame(fadeIn);
  }
})();
</script>


<script>
/* 主动注销所有 Service Worker + 清缓存（确保永远最新） */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  });
}
if ("caches" in window) {
  caches.keys().then(function(keys){
    keys.forEach(function(k){ caches.delete(k); });
  });
}
</script>

    setTimeout(function(){
      d.style.opacity = "0";
      setTimeout(function(){ if (d.parentNode) d.parentNode.removeChild(d); }, 300);
    }, 1800);
  }

  /* ---------- 面板不穿透（放行 × 和 checkbox） ---------- */
  ["click", "mousedown", "mouseup", "touchstart", "touchend"].forEach(function(evt){
    PANEL.addEventListener(evt, function(e){
      var t = e.target;
      if (!t) return;

      if (t.closest && t.closest("#cfClose")) return;
      if (t.classList && t.classList.contains("cf-box")) return;   /* checkbox 方块放行 */
      if (t.tagName === "INPUT") return;
      e.stopPropagation();
    }, false);
  });

  /* ---------- 悬浮球：拖拽 + 点击 ---------- */
  var dragging = false, moved = false;
  var ox = 0, oy = 0, sx = 0, sy = 0;
  var lastToggle = 0;
  var TOGGLE_LOCK_MS = 300;   /* 防止双击重复触发 */

  function pt(e){
    if (e.touches && e.touches[0]) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches[0]) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function togglePanel(){
    var now = Date.now();
    if (now - lastToggle < TOGGLE_LOCK_MS) return;
    lastToggle = now;
    PANEL.classList.toggle("show");
  }

  function onDown(e){
    dragging = true; moved = false;
    var p = pt(e), r = FAB.getBoundingClientRect();
    sx = p.x; sy = p.y;
    ox = p.x - r.left; oy = p.y - r.top;
    FAB.style.transition = "none";
  }

  function onMove(e){
    if (!dragging) return;
    var p = pt(e);
    if (Math.abs(p.x - sx) > 5 || Math.abs(p.y - sy) > 5) moved = true;
    if (!moved) return;
    var nx = p.x - ox, ny = p.y - oy;
    nx = Math.max(0, Math.min(window.innerWidth - FAB.offsetWidth, nx));
    ny = Math.max(0, Math.min(window.innerHeight - FAB.offsetHeight, ny));
    FAB.style.left = nx + "px";
    FAB.style.top = ny + "px";
    FAB.style.right = "auto";
    FAB.style.bottom = "auto";
    if (e.cancelable) e.preventDefault();
  }

  function onUp(e){
    if (!dragging) return;
    dragging = false;
    FAB.style.transition = "";
    if (!moved) togglePanel();
  }

  FAB.addEventListener("mousedown", onDown);
  FAB.addEventListener("touchstart", onDown, { passive: true });
  document.addEventListener("mousemove", onMove);
  document.addEventListener("touchmove", onMove, { passive: false });
  document.addEventListener("mouseup", onUp);

  function bindCheckbox(id){

  }

  function releaseSan(){
    if (!savedVarsRef || !savedDesc) return;
    try {
      if ("get" in savedDesc || "set" in savedDesc) {
        Object.defineProperty(savedVarsRef, "san", savedDesc);
      } else {
        Object.defineProperty(savedVarsRef, "san", {
          value: frozenValue !== null ? frozenValue : savedDesc.value,
          writable: true, enumerable: true, configurable: true
        });
      }
    } catch(e){}
    isHijacked = false; frozenValue = null; savedVarsRef = null; savedDesc = null;
  }

  function setSanOnce(v2){
    var was = isHijacked;
    if (was) releaseSan();
    var v = getVars();
    if (v) {
      try { v.san = v2; } catch(e){}
      try { if (window.__setVars) window.__setVars({}); } catch(e){}
    }
    if (was) hijackSan(v2);
    return true;
  }

  var CONFIG_KEY = "ec_cheat_config_v1";
  function saveConfig(){
    try {
      localStorage.setItem(CONFIG_KEY, JSON.stringify({
        noLimit: (document.getElementById("cfNoSanLimit") || {}).checked,
        freeze: (document.getElementById("cfFreezeSan") || {}).checked,
        frozenVal: frozenValue
      }));
    } catch(e){}
  }
  function loadConfig(){
    try {
      var raw = localStorage.getItem(CONFIG_KEY);
      if (!raw) return;
      var cfg = JSON.parse(raw);
      if (cfg.noLimit) {
        var el = document.getElementById("cfNoSanLimit");
        if (el) { el.checked = true; }
        window.__NO_SAN_LIMIT = true;
      }
      if (cfg.freeze && cfg.frozenVal !== null) {
        var el2 = document.getElementById("cfFreezeSan");
        if (el2) el2.checked = true;
        setTimeout(function(){
          hijackSan(cfg.frozenVal);
          var fv = document.getElementById("cfFrozenVal");
          if (fv) fv.textContent = cfg.frozenVal;
        }, 1200);
      }
    } catch(e){}
  }
  function delConfig(){ try { localStorage.removeItem(CONFIG_KEY); } catch(e){} }

  var noLimit = document.getElementById("cfNoSanLimit");
  if (noLimit) {
    try { noLimit.checked = localStorage.getItem("ec_no_san_limit") === "1"; } catch(e){}
    window.__NO_SAN_LIMIT = noLimit.checked;
    noLimit.addEventListener("change", function(e){
      try {
        if (noLimit.checked) localStorage.setItem("ec_no_san_limit", "1");
        else localStorage.removeItem("ec_no_san_limit");
      } catch(e2){}
      window.__NO_SAN_LIMIT = noLimit.checked;
      toast(noLimit.checked ? "已关闭上限判定" : "已恢复上限判定");
    });
  }

  var freeze = document.getElementById("cfFreezeSan");
  var frozenValEl = document.getElementById("cfFrozenVal");
  if (freeze) {
    try { freeze.checked = localStorage.getItem("ec_freeze_san") === "1"; } catch(e){}
    if (freeze.checked) {
      setTimeout(function(){
        var v = getVars();
        if (v) { hijackSan(v.san || 0); if (frozenValEl) frozenValEl.textContent = v.san || 0; }
      }, 1200);
    }
    freeze.addEventListener("change", function(e){
      try {
        if (freeze.checked) {
          var v = getVars();
          var cur = v ? (v.san || 0) : 0;
          if (hijackSan(cur)) {
            localStorage.setItem("ec_freeze_san", "1");
            localStorage.setItem("ec_frozen_san_val", String(cur));
            if (frozenValEl) frozenValEl.textContent = cur;
            toast("已冻结恐惧值：" + cur);
          } else { freeze.checked = false; toast("冻结失败"); }
        } else {
          releaseSan();
          try { localStorage.removeItem("ec_freeze_san"); localStorage.removeItem("ec_frozen_san_val"); } catch(e3){}
          if (frozenValEl) frozenValEl.textContent = "-";
          toast("已解除冻结");
        }
      } catch(e4){}
    });
  }

  var input = document.getElementById("cfSanInput");
  var confirmBtn = document.getElementById("cfSanConfirm");
  if (confirmBtn) confirmBtn.addEventListener("click", function(e){
    var v = parseInt(input && input.value, 10);
    if (isNaN(v)) { toast("请输入有效数字"); return; }
    if (v < -999 || v > 999) { toast("范围 -999 ~ 999"); return; }
    if (v >= 100 && !window.__NO_SAN_LIMIT) {
      if (!confirm("值 ≥ 100 但未关闭上限，可能触发结局。继续？")) return;
    }
    var wasFrozen = isHijacked;
    setSanOnce(v);
    if (wasFrozen) {
      try { localStorage.setItem("ec_frozen_san_val", String(v)); } catch(e2){}
      if (frozenValEl) frozenValEl.textContent = v;
      toast("已改为 " + v + "（保持冻结）");
    } else {
      toast("已改为 " + v);
    }
  });
  if (input) input.addEventListener("keydown", function(e){
    if (e.key === "Enter" && confirmBtn) confirmBtn.click();
  });

  /* 自动保存：开关变化时立即保存 */
  var _autoSave = function(){ saveConfig(); };
  var _noLimit = document.getElementById("cfNoSanLimit");
  var _freeze = document.getElementById("cfFreezeSan");
  if (_noLimit) _noLimit.addEventListener("change", _autoSave);
  if (_freeze) _freeze.addEventListener("change", _autoSave);
  /* 也定时保存（兜底） */
  setInterval(_autoSave, 3000);

  loadConfig();

  

  /* 恐惧值显示无上限（16ms 覆盖） */
  var $sanFill = document.getElementById("sanFill");
  var $sanNum = document.getElementById("sanNum");
  setInterval(function(){
    var v = getVars();
    if (!v) return;
    var s = v.san;
    if (s === null || s === undefined) return;
    if ($sanNum && $sanNum.textContent !== String(s)) $sanNum.textContent = String(s);
    if ($sanFill) {
      var pct = s < 0 ? 0 : (s > 100 ? 100 : s);
      var tgt = pct + "%";
      if ($sanFill.style.width !== tgt) $sanFill.style.width = tgt;
    }
  }, 16);
})();
</script>
