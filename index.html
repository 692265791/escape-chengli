<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0d0d0d">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>逃离 程丽</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent!important}
html,body{
  background:#0a0a0a;color:#e8e8e8;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  min-height:100vh;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;transition:opacity 1s cubic-bezier(.4,0,.2,1)}

/* 扫描线 + 暗角 */
.crt{position:fixed;inset:0;pointer-events:none;z-index:1}
.crt::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0px,rgba(0,0,0,.35) 1px,transparent 1px,transparent 5px);
  opacity:.25;mix-blend-mode:multiply;
}
.crt::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 95% 80% at 50% 50%,transparent 50%,rgba(0,0,0,.8) 100%);
}

/* 过场文字 */
#intro{z-index:10}
.intro-line{
  position:absolute;text-align:center;padding:0 32px;
  font-size:clamp(34px,9vw,56px);
  font-weight:500;letter-spacing:.14em;
  color:#e8e8e8;
  opacity:0;transform:translateY(12px);
  transition:opacity 1.4s cubic-bezier(.16,1,.3,1),transform 1.4s cubic-bezier(.16,1,.3,1);
}
.intro-line.show{opacity:1;transform:translateY(0)}
.intro-line.out{opacity:0;transform:translateY(-8px)}
.intro-line.small{
  font-size:clamp(18px,5vw,26px);
  font-weight:400;letter-spacing:.4em;
  color:rgba(232,232,232,.8);
}

/* 轻触进入 */
#enter{z-index:20;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
#enter.show{opacity:1;pointer-events:auto;cursor:pointer}
.enter-inner{text-align:center}
.enter-text{
  font-size:clamp(18px,5vw,24px);
  letter-spacing:.5em;
  color:rgba(232,232,232,.7);
  animation:tapPulse 2s ease-in-out infinite;
}
@keyframes tapPulse{
  0%,100%{opacity:.55}
  50%{opacity:1}
}
.enter-hint{
  margin-top:16px;
  font-size:13px;
  letter-spacing:.3em;
  color:rgba(232,232,232,.3);
}

/* 跳转淡出 */
body.leaving{opacity:0;transition:opacity .6s ease}
</style>

<style>
/* 新页面加载后，从 0 淡入到 1 */
html {
  opacity: 0;
  transition: opacity .4s ease;
}
html.page-ready {
  opacity: 1;
}
</style>
<script>
/* 页面一加载完，立刻淡入 */
(function(){
  function fadeIn(){
    document.documentElement.classList.add("page-ready");
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function(){
      requestAnimationFrame(fadeIn);
    });
  } else {
    requestAnimationFrame(fadeIn);
  }
})();
</script>


<script>
/* 主动注销所有 Service Worker + 清缓存（确保永远最新） */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(regs){
    regs.forEach(function(r){ r.unregister(); });
  });
}
if ("caches" in window) {
  caches.keys().then(function(keys){
    keys.forEach(function(k){ caches.delete(k); });
  });
}
</script>

</head>
<body>

<div class="crt"></div>

<!-- 阶段1：过场文字 -->
<div class="layer" id="intro">
  <div class="intro-line" id="t1">逃 离 程 丽</div>
  <div class="intro-line small" id="t2">恐怖校园文字冒险</div>
</div>

<!-- 阶段2：轻触进入 -->
<div class="layer" id="enter">
  <div class="enter-inner">
    <div class="enter-text">轻 触 进 入 主 页</div>
    <div class="enter-hint">TAP TO ENTER</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  function $(id){ return document.getElementById(id); }

  function showLine(id, hold, done){
    var el = $(id);
    el.classList.remove("out");
    el.classList.add("show");
    setTimeout(function(){
      el.classList.remove("show");
      el.classList.add("out");
      setTimeout(done, 1100);
    }, hold);
  }

  /* 过场：两行文字，约 5 秒 */
  showLine("t1", 1800, function(){
    showLine("t2", 1600, function(){
      setTimeout(function(){
        $("intro").style.opacity = "0";
        setTimeout(function(){
          $("intro").style.display = "none";
          $("enter").classList.add("show");
        }, 800);
      }, 300);
    });
  });

  /* 轻触进入 */
  var entered = false;
  function goHome(){
    if (entered) return;
    entered = true;
    document.body.classList.add("leaving");
    setTimeout(function(){ location.href = "home.html"; }, 650);
  }

  $("enter").addEventListener("click", goHome);
  $("enter").addEventListener("touchend", function(e){
    e.preventDefault();
    goHome();
  }, { passive: false });

})();
</script>



</body>
</html>
