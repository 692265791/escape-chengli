<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>逃离程丽 · 选择线路</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08080a;color:#e8e8ea;
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px;
}
.box{max-width:420px;width:100%}
h1{
  font-size:20px;font-weight:900;letter-spacing:.3em;
  color:#e8e8ea;margin:0 0 6px;text-align:center;
  text-shadow:0 0 20px rgba(200,16,46,.5);
}
.sub{font-size:11px;color:#3a3a3c;letter-spacing:.25em;margin:0 0 28px;text-align:center}
.row{
  display:flex;align-items:flex-start;gap:12px;
  margin:10px 0;padding:14px 16px;
  background:#0f0f12;border:1px solid #1e1e22;border-radius:6px;
  cursor:pointer;transition:border-color .25s,background .25s;
}
.row:hover{border-color:rgba(200,16,46,.5);background:#150608}
.row.best{border-color:#2f8f5b;background:rgba(47,143,91,.08)}
.row.bad{opacity:.4}
.dot{width:8px;height:8px;border-radius:50%;background:#3a3a3c;flex:none;margin-top:5px;transition:background .3s}
.dot.ok{background:#2f8f5b;box-shadow:0 0 8px rgba(47,143,91,.6)}
.dot.bad{background:#c8102e}
.dot.test{background:#c8102e;animation:blink .5s infinite}
@keyframes blink{50%{opacity:.2}}
.name{flex:1;text-align:left;font-size:13px;color:#e8e8ea}
.meta{font-size:11px;color:#4a4a4e;margin-top:4px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:10px;margin-top:22px}
button{
  flex:1;padding:14px;border-radius:6px;
  font-size:14px;font-weight:800;letter-spacing:.15em;
  cursor:pointer;border:none;transition:all .2s;
}
#btnTest{
  background:linear-gradient(135deg,#c8102e,#5a0e18);
  color:#fff;box-shadow:0 8px 24px rgba(200,16,46,.4);
}
#btnTest:disabled{opacity:.4;cursor:not-allowed}
#btnSkip{
  background:transparent;color:#8a8a8e;
  border:1px solid #1e1e22;
}
.tip{
  margin-top:20px;font-size:11px;color:#3a3a3c;
  text-align:center;letter-spacing:.1em;line-height:1.8;
}
</style>
</head>
<body>
<div class="box">
  <h1>选择线路</h1>
  <p class="sub">CHOOSE ROUTE</p>
  <div id="list">
    <div class="row" data-idx="0">
      <span class="dot"></span>
      <div style="flex:1">
        <div class="name">线路 1</div>
        <div class="meta">未测速</div>
      </div>
    </div>
    <div class="row" data-idx="1">
      <span class="dot"></span>
      <div style="flex:1">
        <div class="name">线路 2</div>
        <div class="meta">未测速</div>
      </div>
    </div>
    <div class="row" data-idx="2">
      <span class="dot"></span>
      <div style="flex:1">
        <div class="name">线路 3</div>
        <div class="meta">未测速</div>
      </div>
    </div>
  </div>

  <div class="acts">
    <button id="btnTest">开始测速</button>
    <button id="btnSkip">跳过</button>
  </div>

  <p class="tip">点击开始测速 · 测完手动选择线路</p>
</div>

<script>
(function(){
  var TARGETS = [
    { name: "线路 1", url: "https://chengli.dpdns.org" },
    { name: "线路 2", url: "https://escape-chengli.pages.dev" },
    { name: "线路 3", url: "https://692265791.github.io/escape-chengli" }
  ];

  /* 已选过直接跳 */
  try {
    var p = new URLSearchParams(location.search);
    if (p.get("direct") === "1"){ location.replace("home.html"); return; }
  } catch(e){}

  var rows = document.querySelectorAll(".row");
  var btnTest = document.getElementById("btnTest");
  var btnSkip = document.getElementById("btnSkip");

  /* 点行跳转 */
  rows.forEach(function(row){
    row.addEventListener("click", function(){
      var idx = parseInt(row.dataset.idx, 10);
      var t = TARGETS[idx];
      if (t) go(t.url);
    });
  });

  function go(url){
    url += (url.indexOf("?") === -1 ? "?" : "&") + "direct=1";
    location.replace(url);
  }

  btnSkip.addEventListener("click", function(){
    go(TARGETS[0].url);
  });

  /* ---------- 真实下载测速 ---------- */
  /* 单次测速：下载 probe.bin，返回 { ms, kbps } */
  function downloadTest(baseUrl, timeoutMs){
    return new Promise(function(resolve){
      var url = baseUrl + "/probe.bin?t=" + Date.now() + "_" + Math.random();
      var start = performance.now();
      var xhr = new XMLHttpRequest();
      var done = false;

      function finish(ok, bytes){
        if (done) return; done = true;
        var ms = performance.now() - start;
        if (!ok){ resolve({ ok: false, ms: 99999, kbps: 0 }); return; }
        var kbps = bytes && ms > 0 ? (bytes * 8) / ms : 0;   // 千比特/秒
        resolve({ ok: true, ms: Math.round(ms), kbps: Math.round(kbps) });
      }

      xhr.open("GET", url, true);
      xhr.responseType = "arraybuffer";
      xhr.timeout = timeoutMs;

      xhr.onload = function(){
        if (xhr.status >= 200 && xhr.status < 400){
          finish(true, (xhr.response && xhr.response.byteLength) || 0);
        } else {
          finish(false);
        }
      };
      xhr.onerror = function(){ finish(false); };
      xhr.ontimeout = function(){ finish(false); };

      xhr.send();
    });
  }

  /* 两次测速取优（第 2 次避开 DNS/TLS 冷启动） */
  function measure(baseUrl){
    return new Promise(function(resolve){
      downloadTest(baseUrl, 5000).then(function(r1){
        /* 第一次即使失败也继续测第二次 */
        downloadTest(baseUrl, 5000).then(function(r2){
          var best = null;
          if (r1.ok && r2.ok) best = r1.kbps > r2.kbps ? r1 : r2;
          else if (r1.ok) best = r1;
          else if (r2.ok) best = r2;
          resolve(best || { ok: false, ms: 99999, kbps: 0 });
        });
      });
    });
  }

  btnTest.addEventListener("click", function(){
    btnTest.disabled = true;
    btnTest.textContent = "测速中…";

    /* 重置 */
    rows.forEach(function(row, i){
      row.classList.remove("best", "bad");
      row.querySelector(".dot").className = "dot test";
      row.querySelector(".meta").textContent = "测速中…";
    });

    var results = [];
    var done = 0;
    var bestIdx = -1;
    var bestKbps = 0;

    TARGETS.forEach(function(t, i){
      measure(t.url).then(function(r){
        results.push({ idx: i, r: r });
        done++;
        var row = rows[i];
        var dot = row.querySelector(".dot");
        var meta = row.querySelector(".meta");

        if (r.ok){
          dot.className = "dot ok";
          meta.textContent = r.ms + " ms";
          if (r.kbps > bestKbps){ bestKbps = r.kbps; bestIdx = i; }
        } else {
          dot.className = "dot bad";
          meta.textContent = "超时 / 失败";
          row.classList.add("bad");
        }

        if (done === TARGETS.length){
          if (bestIdx >= 0){
            rows[bestIdx].classList.add("best");
            var name = TARGETS[bestIdx].name;
            btnTest.textContent = "去 " + name;
            btnTest.disabled = false;
            btnTest.onclick = function(){ go(TARGETS[bestIdx].url); };
          } else {
            btnTest.textContent = "全部失败";
            btnTest.disabled = false;
            btnTest.onclick = function(){ go(TARGETS[0].url); };
          }
        }
      });
    });
  });
})();
</script>
</body>
</html>
